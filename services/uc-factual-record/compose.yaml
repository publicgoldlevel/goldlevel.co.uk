name: goldlevel-uc-private-portal

services:
  portal:
    image: "goldlevel-uc-factual-record:${PORTAL_RELEASE_ID:?Set PORTAL_RELEASE_ID}"
    pull_policy: never
    user: "10001:10001"
    read_only: true
    init: true
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    stop_grace_period: 10s
    environment:
      NODE_ENV: production
      PUBLIC_ORIGIN: "${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN}"
      BASE_PATH: /uc_factual_record
      CONTENT_DIR: /content
      USERS_FILE: /run/secrets/users.json
      EDGE_KEY_FILE: /run/secrets/edge-key
      PORT: "8080"
      HOST: 0.0.0.0
    ports: ["127.0.0.1:8787:8080"]
    volumes:
      - type: bind
        source: "${PRIVATE_RUNTIME_DIR:?Set PRIVATE_RUNTIME_DIR}/content"
        target: /content
        read_only: true
        bind:
          create_host_path: false
    secrets:
      - source: users
        target: users.json
      - source: edge_key
        target: edge-key
    tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=16m,uid=10001,gid=10001,mode=0700"]
    networks: [private]
    healthcheck:
      test: ["CMD", "node", "-e", "const r=require('node:http').get('http://127.0.0.1:8080/_health',s=>{s.resume();process.exit(s.statusCode===204?0:1)});r.setTimeout(3000,()=>{r.destroy();process.exit(1)});r.on('error',()=>process.exit(1));"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"

secrets:
  users:
    file: "${PRIVATE_RUNTIME_DIR:?Set PRIVATE_RUNTIME_DIR}/secrets/users.json"
  edge_key:
    file: "${PRIVATE_RUNTIME_DIR:?Set PRIVATE_RUNTIME_DIR}/secrets/edge-key"

networks:
  private:
    internal: true
    attachable: false
    enable_ipv6: false
